//##############################################################################################################################################################
//##############################################################################################################################################################
//  In-VR clickable keyboard (Meta Quest's own system keyboard refuses to
//  show for this app -- see src/engine/menus.cpp's vkeychar()/
//  vkeybackspace()/vkeyenter() comment). Click a key with the controller
//  pointer the same way any other gui button is clicked; it types directly
//  into whichever field on this screen is currently focused.
//
//  A button's action is a *stored* string, executed later at click time --
//  by then, this alias's own $arg1 binding is long gone (cubescript args
//  are dynamically scoped to the currently-executing call, not captured
//  into the block like a closure), so [vkeychar $arg1] would run with an
//  empty argument (confirmed on-device: logcat showed "vkeychar()" with
//  nothing between the parens on every key). concatword builds the actual
//  command string -- with the real letter already substituted in -- right
//  now, while $arg1 still means something.
//
//  arg1/arg2 are the lower/upper case forms (cubescript has no built-in
//  case-conversion command); vkeyshift picks which one is shown and typed.
vkeyshift = 0
vkeytoggleshift = [vkeyshift = (! $vkeyshift)]
vkey = [
    vkeycurrentchar = (? $vkeyshift $arg2 $arg1)
    guibutton $vkeycurrentchar (concatword "vkeychar " $vkeycurrentchar)
]

newgui "namekeyboard" [
    // guifield's own field_() commits/un-focuses a field the instant the
    // cursor isn't hovering it (not just on an actual click elsewhere) --
    // fine for a real mouse that stays over what you're typing, but the
    // controller pointer necessarily leaves the field to click a key.
    // Re-focusing every frame here (after the field's own layout/commit
    // check has already run for this frame) keeps it focused regardless
    // of where the pointer currently is, so key clicks elsewhere on this
    // screen still land in it.
    guititle "enter your name"
    guifield MyName 15 [name $MyName]
    g3d_focusfield "MyName"
    guibar

    // guibutton defaults to closing the whole gui stack on any click
    // (shouldclearmenu, menus.cpp -- fine for one-shot navigation buttons
    // like "load map", wrong here: confirmed on-device that pressing a
    // letter was kicking back out to the main menu instead of typing).
    // guistayopen (already defined in menus.cpp, used elsewhere for
    // exactly this) disables that for everything inside it.
    guistayopen [
        guilist [
            (vkey "q" "Q") (vkey "w" "W") (vkey "e" "E") (vkey "r" "R") (vkey "t" "T")
            (vkey "y" "Y") (vkey "u" "U") (vkey "i" "I") (vkey "o" "O") (vkey "p" "P")
        ]
        guilist [
            (vkey "a" "A") (vkey "s" "S") (vkey "d" "D") (vkey "f" "F") (vkey "g" "G")
            (vkey "h" "H") (vkey "j" "J") (vkey "k" "K") (vkey "l" "L")
        ]
        guilist [
            guibutton (concatword "shift " (? $vkeyshift "ON" "off")) [vkeytoggleshift] ""
            (vkey "z" "Z") (vkey "x" "X") (vkey "c" "C") (vkey "v" "V")
            (vkey "b" "B") (vkey "n" "N") (vkey "m" "M")
        ]
        guilist [
            guibutton "space" [vkeychar " "] ""
            guibutton "backspace" [vkeybackspace] ""
        ]
    ]
    guibutton "done" [vkeyenter; showgui "main"] ""
]
